<!DOCTYPE html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>JurisExito Pro</title>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <script>
      window.process = { env: { API_KEY: '' } };
      
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Cinzel', 'serif'] },
            colors: { legal: { 500: '#f59e0b', 950: '#020617' } }
          }
        }
      };
    </script>
    
    <style>
      body { background-color: #020617; color: #f8fafc; -webkit-font-smoothing: antialiased; margin: 0; overflow: hidden; }
      #splash {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; background: #020617;
        z-index: 9999; transition: opacity 0.4s ease;
      }
      .fade-out { opacity: 0; pointer-events: none; }
      @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
      .loader-line { width: 140px; height: 1px; background: rgba(245,158,11,0.1); margin-top: 24px; overflow: hidden; position: relative; }
      .loader-fill { position: absolute; width: 100%; height: 100%; background: #f59e0b; animation: slide 2s infinite linear; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      
      /* Ajustes extras para iPad */
      input, textarea { font-size: 16px !important; } /* Evita zoom automático chato no iOS */
    </style>

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.460.0?external=react,react-dom",
    "@google/genai": "https://esm.sh/@google/genai@1.33.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="splash">
      <div style="font-family: 'Cinzel', serif; font-size: 1.6rem; color: #f59e0b; letter-spacing: 0.4em; font-weight: 700;">JURISEXITO</div>
      <div class="loader-line"><div class="loader-fill"></div></div>
    </div>
    <div id="root"></div>
    <script type="text/babel" data-type="module" data-presets="react,typescript" src="./index.tsx"></script>
    <script>
      window.addEventListener('load', () => {
        const checkReady = setInterval(() => {
          const root = document.getElementById('root');
          if (root && root.children.length > 0) {
            document.getElementById('splash').classList.add('fade-out');
            clearInterval(checkReady);
          }
        }, 100);
      });
    </script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
